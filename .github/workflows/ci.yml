name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-gradle-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mna/native
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo +stable test --workspace --all-targets --all-features --locked

  mna-integration:
    name: MNA integration (${{ matrix.os }})
    needs: validate-gradle-wrapper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run MNA integration tests
        shell: bash
        run: ./gradlew :mna:test --stacktrace

  gradle-build:
    name: Gradle build
    needs: validate-gradle-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build repository
        run: ./gradlew build --stacktrace
