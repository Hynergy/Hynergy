name: CI

on:
  push:
    branches:
      - main
      - 'v*'
      - 'releases/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      mna: ${{ steps.changes.outputs.mna }}
      gradle: ${{ steps.changes.outputs.gradle }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          write_outputs() {
            echo "rust=$1" >> "$GITHUB_OUTPUT"
            echo "mna=$2" >> "$GITHUB_OUTPUT"
            echo "gradle=$3" >> "$GITHUB_OUTPUT"

            echo "Rust checks: $1"
            echo "MNA integration: $2"
            echo "Gradle build: $3"
          }

          force_all() {
            echo "::warning::$1"
            write_outputs true true true
            exit 0
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            write_outputs true true true
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            current_sha="$PR_HEAD_SHA"
            ci_branch="$GITHUB_HEAD_REF"
          else
            current_sha="$GITHUB_SHA"
            ci_branch="$GITHUB_REF_NAME"
          fi

          [[ -n "$current_sha" ]] || force_all "Current commit could not be resolved; forcing all checks."
          [[ -n "$ci_branch" ]] || force_all "Current branch could not be resolved; forcing all checks."

          runs_file="$(mktemp)"
          jobs_file="$(mktemp)"
          diff_file="$(mktemp)"
          trap 'rm -f "$runs_file" "$jobs_file" "$diff_file"' EXIT

          rust_base=""
          mna_base=""
          gradle_base=""

          scan_branch_for_baselines() {
            local branch="$1"

            [[ -z "$branch" ]] && return 0

            if ! gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="$branch" \
              -f status=completed \
              -f per_page=100 \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' \
              > "$runs_file"
            then
              force_all "Could not query previous CI runs for $branch; forcing all checks."
            fi

            while IFS=$'\t' read -r run_id head_sha; do
              [[ -z "$run_id" || -z "$head_sha" ]] && continue

              if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null ||
                 ! git merge-base --is-ancestor "$head_sha" "$current_sha" 2>/dev/null; then
                continue
              fi

              if ! gh api \
                --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                -f per_page=100 \
                --jq '.jobs[] | [.name, .conclusion] | @tsv' \
                > "$jobs_file"
              then
                force_all "Could not inspect previous CI run ${run_id}; forcing all checks."
              fi

              if [[ -z "$rust_base" ]] &&
                 grep -Fqx $'Rust checks\tsuccess' "$jobs_file"; then
                rust_base="$head_sha"
              fi

              if [[ -z "$mna_base" ]] &&
                 grep -Fqx $'MNA integration (ubuntu-latest)\tsuccess' "$jobs_file" &&
                 grep -Fqx $'MNA integration (windows-latest)\tsuccess' "$jobs_file" &&
                 grep -Fqx $'MNA integration (macos-latest)\tsuccess' "$jobs_file"; then
                mna_base="$head_sha"
              fi

              if [[ -z "$gradle_base" ]] &&
                 grep -Fqx $'Gradle build\tsuccess' "$jobs_file"; then
                gradle_base="$head_sha"
              fi

              if [[ -n "$rust_base" && -n "$mna_base" && -n "$gradle_base" ]]; then
                return 0
              fi
            done < "$runs_file"
          }

          scan_branch_for_baselines "$ci_branch"

          if [[ "$EVENT_NAME" == "pull_request" &&
                ( -z "$rust_base" || -z "$mna_base" || -z "$gradle_base" ) ]]; then
            scan_branch_for_baselines "$PR_BASE_REF"
          fi

          echo "Last successful Rust check: ${rust_base:-none}"
          echo "Last successful MNA integration: ${mna_base:-none}"
          echo "Last successful Gradle build: ${gradle_base:-none}"

          has_matching_change() {
            local base="$1"
            shift

            if [[ -z "$base" ]]; then
              return 0
            fi

            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Baseline $base is unavailable; forcing this check." >&2
              return 0
            fi

            if ! git merge-base --is-ancestor "$base" "$current_sha" 2>/dev/null; then
              echo "Baseline $base is not an ancestor of $current_sha; forcing this check." >&2
              return 0
            fi

            if ! git diff --name-only -z "$base" "$current_sha" > "$diff_file"; then
              echo "Could not diff $base..$current_sha; forcing this check." >&2
              return 0
            fi

            local file
            local pattern

            while IFS= read -r -d '' file; do
              [[ -z "$file" ]] && continue

              [[ "$file" == *.md ]] && continue

              for pattern in "$@"; do
                if [[ "$file" == $pattern ]]; then
                  echo "Relevant change since $base: $file" >&2
                  return 0
                fi
              done
            done < "$diff_file"

            return 1
          }

          rust=false
          mna=false
          gradle=false

          if has_matching_change \
            "$rust_base" \
            'mna/native/*' \
            '.github/workflows/ci.yml'
          then
            rust=true
          fi

          if has_matching_change \
            "$mna_base" \
            'mna/*' \
            'build.gradle.kts' \
            'settings.gradle.kts' \
            'gradle.properties' \
            'gradlew' \
            'gradlew.bat' \
            'gradle/*' \
            '.github/workflows/ci.yml'
          then
            mna=true
          fi

          if has_matching_change \
            "$gradle_base" \
            'core/*' \
            'mna/*' \
            'build.gradle.kts' \
            'settings.gradle.kts' \
            'gradle.properties' \
            'gradlew' \
            'gradlew.bat' \
            'gradle/*' \
            '.github/workflows/ci.yml'
          then
            gradle=true
          fi

          write_outputs "$rust" "$mna" "$gradle"

  validate-gradle-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mna/native

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mna/native/target
          key: cargo-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mna/native/Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings -A dead-code

      - name: Run Rust tests
        run: cargo +stable test --workspace --all-features --locked

  mna-integration:
    name: MNA integration (${{ matrix.os }})
    needs:
      - changes
      - validate-gradle-wrapper
    if: needs.changes.outputs.mna == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mna/build/cargo-target
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mna/native/Cargo.lock') }}
          restore-keys: |
            cargo-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Verify Java and Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version

      - name: Run MNA integration tests
        shell: bash
        run: ./gradlew :mna:test --stacktrace

  gradle-build:
    name: Gradle build
    needs:
      - changes
      - validate-gradle-wrapper
    if: needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mna/build/cargo-target
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mna/native/Cargo.lock') }}
          restore-keys: |
            cargo-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Verify Java and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version

      - name: Build repository
        run: ./gradlew build --stacktrace

  required-checks:
    name: Required checks
    needs:
      - changes
      - validate-gradle-wrapper
      - rust
      - mna-integration
      - gradle-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          MNA_REQUIRED: ${{ needs.changes.outputs.mna }}
          GRADLE_REQUIRED: ${{ needs.changes.outputs.gradle }}

          CHANGES_RESULT: ${{ needs.changes.result }}
          WRAPPER_RESULT: ${{ needs.validate-gradle-wrapper.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          MNA_RESULT: ${{ needs.mna-integration.result }}
          GRADLE_RESULT: ${{ needs.gradle-build.result }}
        run: |
          set -euo pipefail

          echo "Change detection:          $CHANGES_RESULT"
          echo "Gradle wrapper validation: $WRAPPER_RESULT"
          echo "Rust checks:               $RUST_RESULT (required: ${RUST_REQUIRED:-unknown})"
          echo "MNA integration:           $MNA_RESULT (required: ${MNA_REQUIRED:-unknown})"
          echo "Gradle build:              $GRADLE_RESULT (required: ${GRADLE_REQUIRED:-unknown})"

          [[ "$CHANGES_RESULT" == "success" ]] || {
            echo "::error::Change detection failed: $CHANGES_RESULT"
            exit 1
          }

          [[ "$WRAPPER_RESULT" == "success" ]] || {
            echo "::error::Gradle wrapper validation failed: $WRAPPER_RESULT"
            exit 1
          }

          verify_conditional_job() {
            local label="$1"
            local required="$2"
            local result="$3"

            case "$required" in
              true)
                [[ "$result" == "success" ]] || {
                  echo "::error::$label was required but result was: $result"
                  exit 1
                }
                ;;
              false)
                [[ "$result" == "skipped" || "$result" == "success" ]] || {
                  echo "::error::$label was not required but result was: $result"
                  exit 1
                }
                ;;
              *)
                echo "::error::Could not determine whether $label was required."
                exit 1
                ;;
            esac
          }

          verify_conditional_job "Rust checks" "$RUST_REQUIRED" "$RUST_RESULT"
          verify_conditional_job "MNA integration" "$MNA_REQUIRED" "$MNA_RESULT"
          verify_conditional_job "Gradle build" "$GRADLE_REQUIRED" "$GRADLE_RESULT"

          echo "All required CI checks passed."