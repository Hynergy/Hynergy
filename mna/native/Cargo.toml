[workspace]
resolver = "3"
members = [
    "hynergy-mna-ffi",
    "network-engine",
    "network-ir",
    "network-model",
    "network-numerics",
    "network-protocol",
]

[workspace.package]
version = "0.0.1-dev"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true